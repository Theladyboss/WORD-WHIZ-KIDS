<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/owl.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>WORD WHIZ KIDS - Mobile</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');

    :root {
      --color-bg: #0a0a0a;
      --color-text: #ffffff;
      --color-text-muted: #a0a0a0;
      --color-primary: #00ff9d;
      --color-primary-glow: rgba(0, 255, 157, 0.5);
      --glass-bg: rgba(255, 255, 255, 0.05);
      --glass-border: rgba(255, 255, 255, 0.1);
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      margin: 0;
      padding: 0;
      background-color: var(--color-bg);
      color: var(--color-text);
      font-family: 'Inter', sans-serif;
      -webkit-font-smoothing: antialiased;
      touch-action: manipulation;
      overscroll-behavior: none;
    }

    #root {
      width: 100%;
      min-height: 100vh;
    }
  </style>
  <style>
    #error-display {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.9);
      color: red;
      z-index: 9999;
      padding: 20px;
      overflow: auto;
      font-family: monospace;
      white-space: pre-wrap;
    }
  </style>
  <script>
    window.onerror = function (message, source, lineno, colno, error) {
      var errorDisplay = document.getElementById('error-display');
      if (!errorDisplay) {
        errorDisplay = document.createElement('div');
        errorDisplay.id = 'error-display';
        document.body.appendChild(errorDisplay);
      }
      errorDisplay.style.display = 'block';
      errorDisplay.innerHTML += 'Error: ' + message + '\nSource: ' + source + '\nLine: ' + lineno + '\n\n';
    };
    window.addEventListener('unhandledrejection', function (event) {
      var errorDisplay = document.getElementById('error-display');
      if (!errorDisplay) {
        errorDisplay = document.createElement('div');
        errorDisplay.id = 'error-display';
        document.body.appendChild(errorDisplay);
      }
      errorDisplay.style.display = 'block';
      errorDisplay.innerHTML += 'Promise Rejection: ' + event.reason + '\n\n';
    });
  </script>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
