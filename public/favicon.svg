<svg width="100" height="100" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Definitions for gradients -->
  <defs>
    <radialGradient id="coreGradient" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(50 50) rotate(90) scale(25)">
      <stop stop-color="#2bbc9a"/>
      <stop offset="1" stop-color="#0088d4"/>
    </radialGradient>
  </defs>

  <!-- Outer Ring (Blue) - Left and Right segments -->
  <!-- Scaled up: Radius 45 (was 35). Path from 5 to 95. -->
  <path d="M 5 50 A 45 45 0 0 1 95 50" stroke="#0088d4" stroke-width="6" stroke-linecap="round" transform="rotate(90 50 50)" opacity="0.9" />
  <path d="M 5 50 A 45 45 0 0 1 95 50" stroke="#0088d4" stroke-width="6" stroke-linecap="round" transform="rotate(270 50 50)" opacity="0.9" />

  <!-- Middle Ring (Green) - Top and Bottom segments -->
  <!-- Scaled up: Radius 32 (was 25). Path from 18 to 82. -->
  <path d="M 18 50 A 32 32 0 0 1 82 50" stroke="#2bbc9a" stroke-width="6" stroke-linecap="round" transform="rotate(0 50 50)" opacity="0.9" />
  <path d="M 18 50 A 32 32 0 0 1 82 50" stroke="#2bbc9a" stroke-width="6" stroke-linecap="round" transform="rotate(180 50 50)" opacity="0.9" />

  <!-- Inner Core (Gradient) -->
  <!-- Scaled up: Radius 20 (was 15) -->
  <circle cx="50" cy="50" r="20" fill="url(#coreGradient)" opacity="0.8" />

  <!-- Core Solid (White) -->
  <!-- Scaled up: Radius 9 (was 7) -->
  <circle cx="50" cy="50" r="9" fill="white" />
</svg>
